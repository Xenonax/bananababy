<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Baby The Game</title>
  <style>
    :root {
      --banana: #f5c76b;
      --banana-dark: #de9a2d;
      --sky: #fffbe8;
      --grass: #6bbd63;
      --text: #3b2a1d;
      --panel: rgba(255,255,255,0.7);
      --danger: #d64545;
      --shadow: rgba(0,0,0,0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--sky);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      max-width: 820px;
      margin: 50px auto 30px;
      padding: 0 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      color: #e8a33d;
      margin-bottom: 0.4rem;
      line-height: 1.1;
    }

    p {
      font-size: 1.1rem;
      margin: 0.45rem 0;
    }

    .hero-art {
      display: block;
      max-width: 240px;
      width: 100%;
      height: auto;
      margin: 0 auto 24px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.08));
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 20px 18px 18px;
      margin-top: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #message {
      min-height: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      min-height: 24px;
      font-weight: 700;
      color: #7a4b18;
      font-size: 0.96rem;
      letter-spacing: 0.02em;
      opacity: 0.95;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    button {
      font-size: 1rem;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--banana-dark);
      color: white;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    button:hover {
      background: #c77f1a;
      transform: translateY(-1px);
    }

    #hud {
      max-width: 720px;
      margin: 14px auto 0;
      display: none;
      justify-content: space-between;
      font-weight: 800;
      color: var(--text);
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #gameCanvas {
      display: none;
      width: 100%;
      max-width: 720px;
      background: linear-gradient(#bfe3ff, #dff9c5 62%, #9ad96a 62%, #5ab153 100%);
      border: 6px solid #e9c56f;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(89, 56, 16, 0.15);
      margin: 18px auto 0;
      cursor: crosshair;
      touch-action: none;
    }

    .touch-controls {
      display: none;
      max-width: 720px;
      margin: 16px auto 0;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .touch-controls.visible {
      display: flex;
    }

    .touch-controls .pad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
      padding: 8px;
      border-radius: 14px;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .touch-btn {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 1.1rem;
      background: rgba(245,199,107,0.9);
      color: #583d1b;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
      user-select: none;
      touch-action: none;
    }

    .touch-btn:active,
    .touch-btn.active {
      transform: scale(0.96);
      background: rgba(222,154,45,0.95);
      color: white;
    }

    @media (max-width: 680px) {
      body { margin-top: 20px; }
      .touch-controls { display: flex; }
    }
  </style>
</head>
<body>
  <h1>🍌 BANANA BABY<br>The Game 🍌</h1>
  <p>CAN YOU SAVE COCONUT ISLAND?</p>
  <p><img class="hero-art" src="banana_baby.png" alt="Banana Baby illustration"></p>

  <div class="box">
    <p id="message">Get ready for BANANA BABY The Game!</p>
    <div id="subtitle" class="subtitle">Fruit Fly threat incoming...</div>
    <button id="startButton" type="button">START GAME</button>
  </div>

  <div id="hud">
    <span id="scoreText">Score: 0</span>
    <span id="comboText">Combo: x1</span>
    <span id="livesText">Lives: 5</span>
  </div>

  <div id="touchControls" class="touch-controls" aria-label="Touch controls">
    <div class="pad">
      <div></div>
      <button class="touch-btn" data-key="arrowup" aria-label="Move up">▲</button>
      <div></div>
      <button class="touch-btn" data-key="arrowleft" aria-label="Move left">◀</button>
      <button class="touch-btn" data-key="arrowdown" aria-label="Move down">▼</button>
      <button class="touch-btn" data-key="arrowright" aria-label="Move right">▶</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="720" height="420" aria-label="Banana Baby pseudo-3D shooter game"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const subtitleEl = document.getElementById('subtitle');
    const startButton = document.getElementById('startButton');
    const hud = document.getElementById('hud');
    const scoreText = document.getElementById('scoreText');
    const comboText = document.getElementById('comboText');
    const livesText = document.getElementById('livesText');
    const touchControls = document.getElementById('touchControls');

    const playerImage = new Image();
    playerImage.src = 'banana_baby.png';
    const keys = {};

    const audio = {
      ctx: null,
      master: null,
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.16;
        this.master.connect(this.ctx.destination);
      },
      tone(frequency, duration, type = 'sine', volume = 0.05, endFrequency = null, attack = 0.02) {
        if (!this.ctx || !this.master) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, now);
        if (endFrequency) {
          osc.frequency.exponentialRampToValueAtTime(endFrequency, now + duration);
        }

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.master);

        osc.start(now);
        osc.stop(now + duration + 0.04);
      },
      shoot() {
        this.tone(620, 0.08, 'square', 0.025, 440);
        this.tone(780, 0.05, 'triangle', 0.02, 660);
      },
      hit() {
        this.tone(180, 0.08, 'sawtooth', 0.04, 90);
      },
      bossHit() {
        this.tone(220, 0.12, 'square', 0.06, 120);
        this.tone(340, 0.18, 'triangle', 0.04, 180);
      },
      bossSpawn() {
        this.tone(110, 0.18, 'sawtooth', 0.07, 80);
        this.tone(170, 0.22, 'triangle', 0.04, 110);
      },
      victory() {
        this.tone(392, 0.22, 'triangle', 0.05, 392);
        this.tone(523.25, 0.26, 'triangle', 0.05, 523.25);
        this.tone(659.25, 0.32, 'triangle', 0.06, 659.25);
        this.tone(783.99, 0.42, 'triangle', 0.07, 783.99);
      },
      lose() {
        this.tone(180, 0.18, 'square', 0.04, 100);
        this.tone(120, 0.3, 'sawtooth', 0.045, 60);
      }
    };

    const game = {
      started: false,
      over: false,
      score: 0,
      lives: 5,
      combo: 1,
      comboTimer: 0,
      targetScore: 18,
      lastTime: 0,
      spawnTimer: 0,
      player: { x: 360, y: 350, r: 26, speed: 6, vx: 0, vy: 0 },
      enemies: [],
      bullets: [],
      particles: [],
      clouds: [],
      boss: null,
      bossSpawned: false,
      bossDefeated: false,
      bossGoal: 3,
      bossesDefeated: 0,
      subtitleTimer: 0,
      enemyShots: [],
      pointerTarget: null,
      dragging: false,
      ignoreNextClick: false,
      autoFireCooldown: 0,
      cutscene: null,
      bossExplosion: []
    };

    function rand(min, max) { return min + Math.random() * (max - min); }
    function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

    function setSubtitle(text, duration = 120) {
      subtitleEl.textContent = text;
      game.subtitleTimer = duration;
      subtitleEl.style.opacity = '1';
    }

    function setCombo(multiplier) {
      game.combo = multiplier;
      comboText.textContent = 'Combo: x' + game.combo;
      game.comboTimer = 130;
    }

    function updateCombo() {
      if (game.comboTimer > 0) {
        game.comboTimer -= 1;
      } else if (game.combo > 1) {
        game.combo = 1;
        comboText.textContent = 'Combo: x1';
      }

      if (game.subtitleTimer > 0) {
        game.subtitleTimer -= 1;
      } else {
        subtitleEl.style.opacity = '0.78';
      }
    }

    function initClouds() {
      game.clouds = [];
      for (let i = 0; i < 8; i++) {
        game.clouds.push({
          x: rand(0, canvas.width),
          y: rand(30, 160),
          r: rand(22, 42),
          speed: rand(0.2, 0.8),
          alpha: rand(0.2, 0.45)
        });
      }
    }

    function getPointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    function makeEnemy() {
      return {
        x: rand(60, canvas.width - 60),
        y: -20,
        r: rand(16, 28),
        speed: rand(1.4, 2.6),
        drift: Math.random() * Math.PI * 2,
        phase: Math.random() * 100,
        bag: Math.random() > 0.5,
        z: rand(0.7, 1.8),
        tilt: rand(-0.5, 0.5),
        boss: false
      };
    }

    function makeBoss() {
      return {
        x: canvas.width / 2,
        y: -60,
        r: 46,
        speed: 1.2,
        health: 12,
        boss: true,
        phase: 0,
        tilt: 0,
        z: 1.6,
        fireCooldown: 80
      };
    }

    function spawnBossExplosion(x, y) {
      game.bossExplosion = [];
      for (let i = 0; i < 58; i++) {
        const angle = (Math.PI * 2 * i) / 58;
        const speed = rand(1.8, 4.8);
        game.bossExplosion.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(24, 52),
          color: i % 2 === 0 ? '#f5d45d' : '#e86b3d',
          size: rand(3, 7)
        });
      }
    }

    function startVictoryCutscene() {
      game.cutscene = {
        timer: 0,
        duration: 280,
        title: 'COCONUT ISLAND SAVED!',
        subtitle: 'Banana Baby wins the day!',
        footer: 'The Fruit Fly King is down. The island is safe.'
      };
      setSubtitle('Coconut Island is safe!', 200);
      audio.victory();
    }

    function resetGame() {
      audio.init();
      game.started = true;
      game.over = false;
      game.score = 0;
      game.lives = 5;
      game.combo = 1;
      game.comboTimer = 0;
      game.spawnTimer = 0;
      game.enemies = [];
      game.bullets = [];
      game.enemyShots = [];
      game.particles = [];
      game.pointerTarget = null;
      game.dragging = false;
      game.ignoreNextClick = false;
      game.autoFireCooldown = 0;
      game.cutscene = null;
      game.bossExplosion = [];
      game.boss = null;
      game.bossSpawned = false;
      game.bossDefeated = false;
      game.bossGoal = 3;
      game.bossesDefeated = 0;
      game.subtitleTimer = 0;
      game.player.x = canvas.width / 2;
      game.player.y = canvas.height - 50;
      game.player.vx = 0;
      game.player.vy = 0;
      initClouds();

      scoreText.textContent = 'Score: 0';
      comboText.textContent = 'Combo: x1';
      livesText.textContent = 'Lives: 5';
      messageEl.textContent = 'Tap the Fruit Fly Guys and blast them with banana shots!';
      setSubtitle('Three bosses stand between you and victory.', 180);
      startButton.textContent = 'PLAY AGAIN';
      hud.style.display = 'flex';
      canvas.style.display = 'block';
      touchControls.classList.add('visible');
    }

    function shootBanana(targetX, targetY) {
      if (!game.started || game.over) return;
      game.bullets.push({
        x: game.player.x,
        y: game.player.y - 12,
        targetX,
        targetY,
        speed: 10,
        radius: 7,
        trail: []
      });
      audio.shoot();
    }

    function spawnBossShot(enemy) {
      game.enemyShots.push({
        x: enemy.x,
        y: enemy.y + 18,
        targetX: game.player.x,
        targetY: game.player.y,
        speed: 4.2,
        radius: 9,
        color: '#d64545'
      });
    }

    function killEnemy(index, isBoss = false) {
      const enemy = game.enemies[index];
      if (!enemy) return;

      if (isBoss) {
        spawnBossExplosion(enemy.x, enemy.y);
        for (let i = 0; i < 18; i++) {
          game.particles.push({
            x: enemy.x,
            y: enemy.y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 30 + Math.random() * 24,
            color: '#f3c76d'
          });
        }

        game.enemies.splice(index, 1);
        game.score += 8 * game.combo;
        game.boss = null;
        game.bossSpawned = false;
        game.bossDefeated = true;

        scoreText.textContent = 'Score: ' + game.score;
        game.bossesDefeated += 1;

        if (game.bossesDefeated >= game.bossGoal) {
          game.over = true;
          messageEl.textContent = 'You saved Coconut Island! The Fruit Fly Kings are defeated!';
          startButton.textContent = 'PLAY AGAIN';
          setSubtitle('Final boss defeated! The island is safe!', 180);
          startVictoryCutscene();
          return;
        }

        messageEl.textContent = 'Boss defeated! Another one is coming!';
        setSubtitle('Boss ' + (game.bossesDefeated + 1) + ' is approaching...', 180);
        return;
      }

      for (let i = 0; i < 18; i++) {
        game.particles.push({
          x: enemy.x,
          y: enemy.y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 20 + Math.random() * 18,
          color: '#dca739'
        });
      }
      game.enemies.splice(index, 1);

      game.score += 1 * game.combo;
      scoreText.textContent = 'Score: ' + game.score;
      if (game.combo < 6) setCombo(Math.min(game.combo + 1, 6));
    }

    function checkBossSpawn() {
      if (game.over || game.boss || game.bossDefeated) return;
      if (game.score < 2 + game.bossesDefeated * 3) return;
      if (game.bossesDefeated >= game.bossGoal) return;
      if (game.bossSpawned) return;

      game.bossSpawned = true;
      game.boss = makeBoss();
      game.enemies.push(game.boss);
      messageEl.textContent = 'Boss fight! Fruit Fly King ' + (game.bossesDefeated + 1) + ' is here!';
      setSubtitle('Boss ' + (game.bossesDefeated + 1) + ' arrives!', 170);
      audio.bossSpawn();
    }

    function hitEnemy(enemyIndex) {
      const enemy = game.enemies[enemyIndex];
      if (!enemy) return;

      if (enemy.boss) {
        enemy.health -= 1;
        audio.bossHit();
        if (enemy.health <= 0) {
          killEnemy(enemyIndex, true);
        } else {
          messageEl.textContent = 'Boss hit! Keep piling on the damage!';
          setSubtitle('Boss is still standing! Keep attacking!', 120);
        }
        return;
      }

      audio.hit();
      killEnemy(enemyIndex, false);
    }

    function updatePointerFollow() {
      if (!game.pointerTarget) return;

      const targetX = game.pointerTarget.x;
      const targetY = game.pointerTarget.y;
      const dx = targetX - game.player.x;
      const dy = targetY - game.player.y;

      game.player.vx += dx * 0.12;
      game.player.vy += dy * 0.12;
      game.player.vx *= 0.78;
      game.player.vy *= 0.78;

      game.player.x += game.player.vx;
      game.player.y += game.player.vy;

      game.player.x = clamp(game.player.x, 52, canvas.width - 52);
      game.player.y = clamp(game.player.y, 42, canvas.height - 42);
    }

    function handleMovement() {
      if (game.dragging && game.pointerTarget) {
        updatePointerFollow();
        if (game.autoFireCooldown > 0) game.autoFireCooldown -= 1;
        if (game.autoFireCooldown <= 0) {
          shootBanana(game.pointerTarget.x, game.pointerTarget.y);
          game.autoFireCooldown = 140;
        }
        return;
      }

      let dx = 0;
      let dy = 0;
      if (keys['arrowright'] || keys['d']) dx += 1;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;
      if (keys['arrowup'] || keys['w']) dy -= 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy) || 1;
        game.player.x += (dx / length) * game.player.speed;
        game.player.y += (dy / length) * game.player.speed;
      }

      game.player.x = clamp(game.player.x, 52, canvas.width - 52);
      game.player.y = clamp(game.player.y, 42, canvas.height - 42);
    }

    function updateBullets() {
      for (let i = game.bullets.length - 1; i >= 0; i--) {
        const bullet = game.bullets[i];
        bullet.trail.push({ x: bullet.x, y: bullet.y });
        if (bullet.trail.length > 8) bullet.trail.shift();

        const dx = bullet.targetX - bullet.x;
        const dy = bullet.targetY - bullet.y;
        const dist = Math.hypot(dx, dy) || 1;

        if (dist <= bullet.speed + 1) {
          for (let j = 0; j < game.enemies.length; j++) {
            const enemy = game.enemies[j];
            if (Math.hypot(enemy.x - bullet.targetX, enemy.y - bullet.targetY) <= enemy.r + 10) {
              hitEnemy(j);
              game.bullets.splice(i, 1);
              return;
            }
          }
        }

        bullet.x += (dx / dist) * bullet.speed;
        bullet.y += (dy / dist) * bullet.speed;

        if (bullet.x < -10 || bullet.x > canvas.width + 10 || bullet.y < -10 || bullet.y > canvas.height + 10) {
          game.bullets.splice(i, 1);
        }
      }
    }

    function updateEnemyShots() {
      for (let i = game.enemyShots.length - 1; i >= 0; i--) {
        const shot = game.enemyShots[i];
        const dx = shot.targetX - shot.x;
        const dy = shot.targetY - shot.y;
        const dist = Math.hypot(dx, dy) || 1;

        shot.x += (dx / dist) * shot.speed;
        shot.y += (dy / dist) * shot.speed;

        if (Math.hypot(shot.x - game.player.x, shot.y - game.player.y) < 22) {
          game.enemyShots.splice(i, 1);
          game.lives -= 1;
          livesText.textContent = 'Lives: ' + game.lives;
          messageEl.textContent = 'The boss shot you! Stay moving!';
          setSubtitle('That one hurt! Keep it moving!', 120);
          audio.lose();

          if (game.lives <= 0) {
            game.over = true;
            messageEl.textContent = 'Banana Baby got overwhelmed. Press PLAY AGAIN!';
            startButton.textContent = 'PLAY AGAIN';
          }
          continue;
        }

        if (shot.x < -20 || shot.x > canvas.width + 20 || shot.y < -20 || shot.y > canvas.height + 20) {
          game.enemyShots.splice(i, 1);
        }
      }
    }

    function updateEnemies() {
      game.spawnTimer += 1;
      if (!game.boss && !game.bossDefeated && game.spawnTimer > 58) {
        game.spawnTimer = 0;
        const normalEnemies = game.enemies.filter(e => !e.boss).length;
        const spawnLimit = 4;
        const spawnCount = Math.min(1, spawnLimit - normalEnemies);

        if (spawnCount > 0) {
          for (let i = 0; i < spawnCount; i++) {
            game.enemies.push(makeEnemy());
          }
        }
      }

      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const enemy = game.enemies[i];
        if (enemy.boss) {
          enemy.phase += 0.08;
          enemy.x += Math.sin(enemy.phase) * 2.2;
          enemy.y = Math.min(enemy.y + enemy.speed * 1.2, 110);
          enemy.tilt = Math.sin(enemy.phase) * 0.5;
          enemy.fireCooldown -= 1;

          if (enemy.fireCooldown <= 0) {
            spawnBossShot(enemy);
            enemy.fireCooldown = 80;
          }

          if (enemy.x < 50 || enemy.x > canvas.width - 50) {
            enemy.x = clamp(enemy.x, 50, canvas.width - 50);
          }

          if (enemy.health <= 0) {
            hitEnemy(i);
          }
          continue;
        }

        enemy.y += enemy.speed * 1.2;
        enemy.x += Math.sin((enemy.y + enemy.phase) * 0.15) * (2.2 * enemy.z);

        if (enemy.y > canvas.height - 12) {
          game.enemies.splice(i, 1);
          game.lives -= 1;
          livesText.textContent = 'Lives: ' + game.lives;
          messageEl.textContent = 'A Fruit Fly Guy stole cash! Watch out!';
          setSubtitle('No! Another one slipped through!', 120);

          if (game.lives <= 0) {
            game.over = true;
            messageEl.textContent = 'Banana Baby got overwhelmed. Press PLAY AGAIN!';
            startButton.textContent = 'PLAY AGAIN';
            audio.lose();
          }
        }
      }
    }

    function updateParticles() {
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) game.particles.splice(i, 1);
      }
    }

    function updateBossExplosion() {
      for (let i = game.bossExplosion.length - 1; i >= 0; i--) {
        const p = game.bossExplosion[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life -= 1;
        if (p.life <= 0) game.bossExplosion.splice(i, 1);
      }
    }

    function updateClouds() {
      for (const cloud of game.clouds) {
        cloud.x += cloud.speed;
        if (cloud.x > canvas.width + cloud.r) cloud.x = -cloud.r;
      }
    }

    function updateCutscene() {
      if (!game.cutscene) return;
      game.cutscene.timer += 1;
      if (game.cutscene.timer >= game.cutscene.duration) {
        game.cutscene = null;
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#bfe9ff');
      sky.addColorStop(0.7, '#dff9c5');
      sky.addColorStop(0.7, '#9ad96a');
      sky.addColorStop(1, '#5ab153');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const cloud of game.clouds) {
        ctx.fillStyle = `rgba(255,255,255,${cloud.alpha})`;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.r * 0.8, cloud.y + 8, cloud.r * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.r * 0.7, cloud.y + 5, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0, canvas.height * 0.65, canvas.width, 10);

      ctx.fillStyle = '#7ecf72';
      ctx.fillRect(0, canvas.height * 0.72, canvas.width, canvas.height * 0.28);

      for (let i = 0; i < 15; i++) {
        const x = (i * 58) % canvas.width;
        const y = canvas.height * 0.75 + (i % 3) * 14;
        ctx.fillStyle = '#6bbf59';
        ctx.fillRect(x, y, 25, 32);
      }
    }

    function drawPlayer() {
      const { x, y, r } = game.player;

      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(x, y + 25, 40, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      if (playerImage.complete && playerImage.naturalWidth > 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.drawImage(playerImage, -28, -28, 56, 56);
        ctx.restore();
        return;
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#f6cf5d';
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.95, r * 1.05, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d4a126';
      ctx.beginPath();
      ctx.moveTo(-12, -10);
      ctx.lineTo(12, -18);
      ctx.lineTo(10, -4);
      ctx.lineTo(-10, -2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-7, -4, 2.3, 0, Math.PI * 2);
      ctx.arc(7, -4, 2.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 6, 6, 0.1, Math.PI - 0.1);
      ctx.stroke();
      ctx.restore();
    }

    function drawBossBar() {
      if (!game.boss) return;

      const width = 220;
      const x = (canvas.width - width) / 2;
      const y = 18;
      const hpRatio = clamp(game.boss.health / 12, 0, 1);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x, y, width, 18);

      ctx.fillStyle = '#d64545';
      ctx.fillRect(x + 2, y + 2, (width - 4) * hpRatio, 14);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('FRUIT FLY KING', x + 44, y + 13);
    }

    function drawBoss(enemy) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.tilt);

      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.ellipse(0, enemy.r + 18, enemy.r * 1.6, enemy.r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7f7f7f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 42, 26, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5e5e5e';
      ctx.beginPath();
      ctx.arc(0, -30, 32, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f6d3d3';
      ctx.beginPath();
      ctx.arc(-12, -32, 7, 0, Math.PI * 2);
      ctx.arc(12, -32, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d64545';
      ctx.beginPath();
      ctx.arc(-12, -32, 3.5, 0, Math.PI * 2);
      ctx.arc(12, -32, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#9a6b2b';
      ctx.fillRect(18, 6, 14, 16);

      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-24, 0); ctx.lineTo(-40, 26);
      ctx.moveTo(24, 0); ctx.lineTo(40, 26);
      ctx.moveTo(-18, 18); ctx.lineTo(-18, 34);
      ctx.moveTo(18, 18); ctx.lineTo(18, 34);
      ctx.stroke();

      ctx.fillStyle = '#e6d3a4';
      ctx.fillRect(-12, 28, 24, 6);

      ctx.fillStyle = '#2f2f2f';
      ctx.fillRect(-5, 34, 10, 7);

      ctx.fillStyle = '#e9e9e9';
      ctx.fillRect(-32, 10, 18, 8);
      ctx.fillRect(14, 10, 18, 8);

      ctx.fillStyle = '#d9d9d9';
      ctx.fillRect(-30, 12, 14, 4);
      ctx.fillRect(16, 12, 14, 4);

      ctx.fillStyle = '#d9d9d9';
      ctx.fillRect(-42, -10, 12, 5);
      ctx.fillRect(30, -10, 12, 5);

      ctx.fillStyle = '#c2a15a';
      ctx.fillRect(-10, -45, 20, 8);

      ctx.fillStyle = '#6d6d6d';
      ctx.fillRect(-52, -8, 12, 6);
      ctx.fillRect(40, -8, 12, 6);
      ctx.restore();
    }

    function drawEnemy(enemy) {
      if (enemy.boss) {
        drawBoss(enemy);
        return;
      }

      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.scale(1, 1 + (enemy.z - 1) * 0.3);
      ctx.rotate(enemy.tilt);

      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, enemy.r + 14, enemy.r * 1.5, enemy.r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7b7b7b';
      ctx.beginPath();
      ctx.ellipse(0, 6, 17, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5c5c5c';
      ctx.beginPath();
      ctx.arc(0, -10, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f8d7d7';
      ctx.beginPath();
      ctx.arc(-5, -12, 4.5, 0, Math.PI * 2);
      ctx.arc(5, -12, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d84545';
      ctx.beginPath();
      ctx.arc(-5, -12, 2.2, 0, Math.PI * 2);
      ctx.arc(5, -12, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, 16); ctx.lineTo(-28, 27);
      ctx.moveTo(14, 16); ctx.lineTo(28, 27);
      ctx.moveTo(-8, 22); ctx.lineTo(-4, 34);
      ctx.moveTo(8, 22); ctx.lineTo(4, 34);
      ctx.stroke();

      ctx.fillStyle = '#a1a1a1';
      ctx.fillRect(-8, 0, 16, 10);
      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of game.bullets) {
        for (let i = 0; i < bullet.trail.length; i++) {
          const t = bullet.trail[i];
          ctx.fillStyle = `rgba(169, 121, 42, ${i / bullet.trail.length})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#f3c76d';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemyShots() {
      for (const shot of game.enemyShots) {
        ctx.fillStyle = '#d64545';
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of game.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillRect(p.x, p.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function drawBossExplosion() {
      for (const p of game.bossExplosion) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 50);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawCutscene() {
      if (!game.cutscene) return;
      const alpha = clamp(1 - game.cutscene.timer / game.cutscene.duration, 0, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(game.cutscene.title, canvas.width / 2, canvas.height / 2 - 8);
      ctx.font = '18px sans-serif';
      ctx.fillText(game.cutscene.subtitle, canvas.width / 2, canvas.height / 2 + 28);
      ctx.font = '14px sans-serif';
      ctx.fillText(game.cutscene.footer, canvas.width / 2, canvas.height / 2 + 56);
      ctx.textAlign = 'start';
    }

    function draw() {
      drawBackground();
      drawBossExplosion();
      drawParticles();
      drawBullets();
      drawEnemyShots();
      for (const enemy of game.enemies) drawEnemy(enemy);
      drawPlayer();
      drawBossBar();
      drawCutscene();
    }

    function update() {
      if (!game.started || game.over) return;
      updateCombo();
      handleMovement();
      updateClouds();
      updateBullets();
      updateEnemyShots();
      updateEnemies();
      checkBossSpawn();
      updateParticles();
      updateBossExplosion();
      updateCutscene();
      draw();
    }

    function startGame() {
      resetGame();
      requestAnimationFrame(loop);
    }

    function loop() {
      update();
      requestAnimationFrame(loop);
    }

    startButton.addEventListener('click', () => {
      if (!game.started || game.over) {
        startGame();
      }
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
        event.preventDefault();
      }
      keys[key] = true;
      if (key === ' ') {
        shootBanana(game.player.x, game.player.y - 100);
      }
    });

    document.addEventListener('keyup', (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    canvas.addEventListener('pointerdown', (event) => {
      const pos = getPointerPosition(event);
      game.pointerTarget = pos;
      game.dragging = true;
      game.ignoreNextClick = true;
      shootBanana(pos.x, pos.y);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (game.dragging) {
        game.pointerTarget = getPointerPosition(event);
      }
    });

    canvas.addEventListener('pointerup', () => {
      game.dragging = false;
      game.pointerTarget = null;
      game.ignoreNextClick = false;
    });

    canvas.addEventListener('pointerleave', () => {
      game.dragging = false;
      game.pointerTarget = null;
    });

    initClouds();
    draw();
  </script>
</body>
</html>
