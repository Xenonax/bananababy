<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banana Baby The Game</title>
  <style>
    :root {
      --sky: #fffbe8;
      --panel: rgba(255,255,255,0.72);
      --banana: #f5c76b;
      --banana-dark: #de9a2d;
      --text: #402d1c;
      --danger: #d64545;
      --grass: #6bbd63;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--sky);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }
    body {
      max-width: 820px;
      margin: 30px auto;
      padding: 0 18px 40px;
    }
    h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      color: #e8a33d;
      margin: 0 0 .5rem;
    }
    .box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      padding: 18px;
      margin-top: 12px;
    }
    #message { font-weight: 800; min-height: 24px; }
    .subtitle {
      min-height: 22px;
      color: #7a4b18;
      font-weight: 700;
      opacity: .9;
    }
    button {
      border: none;
      border-radius: 10px;
      background: var(--banana-dark);
      color: white;
      font-weight: 800;
      padding: 12px 22px;
      margin-top: 10px;
      cursor: pointer;
    }
    #hud {
      display: none;
      justify-content: space-between;
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 12px;
      font-weight: 800;
    }
    canvas {
      display: none;
      width: 100%;
      max-width: 720px;
      margin: 16px auto 0;
      border: 6px solid #e7c875;
      border-radius: 18px;
      background: linear-gradient(#bfeaff, #dff9c5 62%, #9ad96a 62%, #5ab153 100%);
    }
  </style>
</head>
<body>
  <h1>🍌 BANANA BABY<br>The Game 🍌</h1>
  <p>CAN YOU SAVE COCONUT ISLAND?</p>
  <div class="box">
    <p id="message">Get ready for BANANA BABY The Game!</p>
    <div id="subtitle" class="subtitle">Fruit Fly threat incoming...</div>
    <button id="startButton" type="button">START GAME</button>
  </div>

  <div id="hud">
    <span id="scoreText">Score: 0</span>
    <span id="comboText">Combo: x1</span>
    <span id="livesText">Lives: 5</span>
  </div>

  <canvas id="gameCanvas" width="720" height="420"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const subtitleEl = document.getElementById('subtitle');
    const scoreText = document.getElementById('scoreText');
    const comboText = document.getElementById('comboText');
    const livesText = document.getElementById('livesText');
    const hud = document.getElementById('hud');
    const startButton = document.getElementById('startButton');

    const keys = {};
    const game = {
      started: false,
      over: false,
      score: 0,
      lives: 5,
      combo: 1,
      comboTimer: 0,
      spawnTimer: 0,
      player: { x: 360, y: 350, r: 22, speed: 6 },
      enemies: [],
      bullets: [],
      particles: [],
      boss: null,
      bossGoal: 3,
      bossesDefeated: 0,
      bossSpawned: false,
      bossDefeated: false,
      enemyShots: []
    };

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }
    function setSubtitle(text, dur = 120) {
      subtitleEl.textContent = text;
      game.subtitleTimer = dur;
    }

    function makeEnemy() {
      return {
        x: rand(40, canvas.width - 40),
        y: -20,
        r: rand(16, 28),
        speed: rand(1.4, 2.6),
        phase: Math.random() * 100,
        z: rand(0.8, 1.8),
        tilt: rand(-0.5, 0.5),
        boss: false
      };
    }

    function makeBoss() {
      return {
        x: canvas.width / 2,
        y: -60,
        r: 44,
        speed: 1.3,
        health: 12,
        boss: true,
        phase: 0,
        tilt: 0,
        fireCooldown: 70
      };
    }

    function resetGame() {
      game.started = true;
      game.over = false;
      game.score = 0;
      game.lives = 5;
      game.combo = 1;
      game.comboTimer = 0;
      game.spawnTimer = 0;
      game.enemies = [];
      game.bullets = [];
      game.particles = [];
      game.enemyShots = [];
      game.player.x = canvas.width / 2;
      game.player.y = canvas.height - 50;
      game.boss = null;
      game.bossSpawned = false;
      game.bossDefeated = false;
      game.bossesDefeated = 0;
      messageEl.textContent = 'Tap and shoot to clear the swarm!';
      setSubtitle('Three bosses stand between you and victory.', 180);
      scoreText.textContent = 'Score: 0';
      comboText.textContent = 'Combo: x1';
      livesText.textContent = 'Lives: 5';
      hud.style.display = 'flex';
      canvas.style.display = 'block';
      startButton.textContent = 'PLAY AGAIN';
    }

    function shootAt(x, y) {
      if (!game.started || game.over) return;
      game.bullets.push({ x: game.player.x, y: game.player.y - 12, targetX: x, targetY: y, speed: 10, radius: 6, trail: [] });
    }

    function killEnemy(index, isBoss = false) {
      const enemy = game.enemies[index];
      if (!enemy) return;

      if (isBoss) {
        for (let i = 0; i < 18; i++) {
          game.particles.push({
            x: enemy.x,
            y: enemy.y,
            vx: rand(-3, 3),
            vy: rand(-3, 3),
            life: 30,
            color: '#f5d45d'
          });
        }
        game.enemies.splice(index, 1);
        game.score += 8 * game.combo;
        game.boss = null;
        game.bossSpawned = false;
        game.bossDefeated = true;
        game.bossesDefeated += 1;
        scoreText.textContent = 'Score: ' + game.score;

        if (game.bossesDefeated >= game.bossGoal) {
          game.over = true;
          messageEl.textContent = 'You saved Coconut Island!';
          setSubtitle('Final boss defeated! The island is safe!', 180);
          return;
        }

        // Fix: do not leave the boss as defeated permanently; allow the next boss to spawn.
        game.bossDefeated = false;
        messageEl.textContent = 'Boss defeated! Another one is coming!';
        setSubtitle('Boss ' + (game.bossesDefeated + 1) + ' is approaching...', 180);
        return;
      }

      for (let i = 0; i < 12; i++) {
        game.particles.push({ x: enemy.x, y: enemy.y, vx: rand(-2, 2), vy: rand(-2, 2), life: 20, color: '#dca739' });
      }
      game.enemies.splice(index, 1);
      game.score += 1 * game.combo;
      scoreText.textContent = 'Score: ' + game.score;
      if (game.combo < 6) game.combo = Math.min(game.combo + 1, 6);
      comboText.textContent = 'Combo: x' + game.combo;
    }

    function hitEnemy(index) {
      const enemy = game.enemies[index];
      if (!enemy) return;
      if (enemy.boss) {
        enemy.health -= 1;
        if (enemy.health <= 0) {
          killEnemy(index, true);
        }
        return;
      }
      killEnemy(index, false);
    }

    function checkBossSpawn() {
      if (game.over || game.boss || game.bossDefeated) return;
      if (game.score < 2 + game.bossesDefeated * 3) return;
      if (game.bossesDefeated >= game.bossGoal) return;
      if (game.bossSpawned) return;

      game.bossSpawned = true;
      game.boss = makeBoss();
      game.enemies.push(game.boss);
      messageEl.textContent = 'Boss fight! Fruit Fly King ' + (game.bossesDefeated + 1) + ' is here!';
      setSubtitle('Boss ' + (game.bossesDefeated + 1) + ' arrives!', 170);
    }

    function updateEnemies() {
      game.spawnTimer += 1;
      if (!game.boss && !game.bossDefeated && game.spawnTimer > 58) {
        game.spawnTimer = 0;
        const active = game.enemies.filter(e => !e.boss).length;
        const spawnLimit = 4;
        const spawnCount = Math.min(1, spawnLimit - active);
        for (let i = 0; i < spawnCount; i++) {
          game.enemies.push(makeEnemy());
        }
      }

      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const enemy = game.enemies[i];

        if (enemy.boss) {
          enemy.phase += 0.08;
          enemy.x += Math.sin(enemy.phase) * 2.2;
          enemy.y = Math.min(enemy.y + enemy.speed * 1.3, 120);
          enemy.tilt = Math.sin(enemy.phase) * 0.6;
          enemy.fireCooldown -= 1;
          if (enemy.fireCooldown <= 0) {
            game.enemyShots.push({ x: enemy.x, y: enemy.y + 18, targetX: game.player.x, targetY: game.player.y, speed: 4.5, radius: 8 });
            enemy.fireCooldown = 80;
          }
          continue;
        }

        enemy.y += enemy.speed * 1.2;
        enemy.x += Math.sin((enemy.y + enemy.phase) * 0.15) * 2.2;
        if (enemy.y > canvas.height - 20) {
          game.enemies.splice(i, 1);
          game.lives -= 1;
          livesText.textContent = 'Lives: ' + game.lives;
          if (game.lives <= 0) {
            game.over = true;
            messageEl.textContent = 'Banana Baby got overwhelmed!';
          }
        }
      }
    }

    function updateBullets() {
      for (let i = game.bullets.length - 1; i >= 0; i--) {
        const bullet = game.bullets[i];
        const dx = bullet.targetX - bullet.x;
        const dy = bullet.targetY - bullet.y;
        const dist = Math.hypot(dx, dy) || 1;
        bullet.x += (dx / dist) * bullet.speed;
        bullet.y += (dy / dist) * bullet.speed;
        bullet.trail.push({ x: bullet.x, y: bullet.y });
        if (bullet.trail.length > 6) bullet.trail.shift();

        for (let j = 0; j < game.enemies.length; j++) {
          const enemy = game.enemies[j];
          if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) <= enemy.r + 8) {
            if (enemy.boss) {
              enemy.health -= 1;
              if (enemy.health <= 0) killEnemy(j, true);
            } else {
              killEnemy(j, false);
            }
            game.bullets.splice(i, 1);
            break;
          }
        }

        if (i >= game.bullets.length) continue;
        if (bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20) {
          game.bullets.splice(i, 1);
        }
      }
    }

    function updateEnemyShots() {
      for (let i = game.enemyShots.length - 1; i >= 0; i--) {
        const shot = game.enemyShots[i];
        const dx = shot.targetX - shot.x;
        const dy = shot.targetY - shot.y;
        const dist = Math.hypot(dx, dy) || 1;
        shot.x += (dx / dist) * shot.speed;
        shot.y += (dy / dist) * shot.speed;
        if (Math.hypot(shot.x - game.player.x, shot.y - game.player.y) < 18) {
          game.enemyShots.splice(i, 1);
          game.lives -= 1;
          livesText.textContent = 'Lives: ' + game.lives;
          if (game.lives <= 0) {
            game.over = true;
            messageEl.textContent = 'Banana Baby got overwhelmed!';
          }
        }
      }
    }

    function updateParticles() {
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) game.particles.splice(i, 1);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#bfeaff');
      g.addColorStop(0.7, '#dff9c5');
      g.addColorStop(0.7, '#9ad96a');
      g.addColorStop(1, '#5ab153');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
    }

    function drawPlayer() {
      const { x, y, r } = game.player;
      ctx.fillStyle = '#f6cf5d';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawEnemy(enemy) {
      if (enemy.boss) {
        ctx.fillStyle = '#7b7b7b';
        ctx.beginPath();
        ctx.ellipse(enemy.x, enemy.y, enemy.r, enemy.r * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#d64545';
        ctx.fillRect(enemy.x - 50, enemy.y - 58, 100, 10);
        ctx.fillStyle = '#3ccf72';
        ctx.fillRect(enemy.x - 50, enemy.y - 58, (enemy.health / 12) * 100, 10);
        return;
      }

      ctx.fillStyle = '#7a7a7a';
      ctx.beginPath();
      ctx.ellipse(enemy.x, enemy.y, enemy.r, enemy.r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBullets() {
      for (const bullet of game.bullets) {
        ctx.fillStyle = '#f3c76d';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemyShots() {
      for (const shot of game.enemyShots) {
        ctx.fillStyle = '#d64545';
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of game.particles) {
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      drawBullets();
      drawEnemyShots();
      for (const enemy of game.enemies) drawEnemy(enemy);
      drawPlayer();
      drawParticles();
    }

    function update() {
      if (!game.started || game.over) return;
      if (game.subtitleTimer > 0) game.subtitleTimer -= 1;
      if (game.subtitleTimer <= 0) subtitleEl.style.opacity = '0.8';
      else subtitleEl.style.opacity = '1';

      let dx = 0;
      if (keys['arrowright'] || keys['d']) dx += 1;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (dx !== 0) game.player.x += dx * game.player.speed;
      game.player.x = clamp(game.player.x, 30, canvas.width - 30);

      updateBullets();
      updateEnemyShots();
      updateEnemies();
      checkBossSpawn();
      updateParticles();
      draw();
    }

    function loop() {
      update();
      requestAnimationFrame(loop);
    }

    startButton.addEventListener('click', () => {
      if (!game.started || game.over) {
        resetGame();
      }
    });

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      shootAt(x, y);
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'a', 'd'].includes(key)) {
        event.preventDefault();
      }
      keys[key] = true;
    });

    document.addEventListener('keyup', (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    requestAnimationFrame(loop);
    draw();
  </script>
</body>
</html>
