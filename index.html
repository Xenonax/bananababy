<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana Baby</title>
    <style>
      :root {
        --banana: #f5c76b;
        --banana-dark: #de9a2d;
        --sky: #fffbe8;
        --text: #3b2a1d;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--sky);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .card {
        width: min(100%, 720px);
        background: rgba(255, 255, 255, 0.88);
        border: 4px solid rgba(222, 154, 45, 0.8);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(89, 56, 16, 0.12);
        padding: 28px 22px 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.3rem, 5vw, 4rem);
        line-height: 1.1;
        color: #e8a33d;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
      }

      .hero-art {
        display: block;
        width: min(100%, 420px);
        height: auto;
        margin: 18px auto 16px;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        background: #fff;
      }

      .tag {
        display: inline-block;
        margin-top: 8px;
        background: var(--banana);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Banana Baby</h1>
      <p>The banana baby artwork is now the face of the page.</p>
      <img class="hero-art" src="banana_baby.png" alt="Banana Baby artwork" />
      <div class="tag">Banana Baby</div>
    </main>
  </body>
</html>
