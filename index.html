<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Baby The Game</title>
  <style>
    :root {
      --banana: #f5c76b;
      --banana-dark: #de9a2d;
      --sky: #fffbe8;
      --grass: #6bbd63;
      --text: #3b2a1d;
      --shadow: rgba(0,0,0,0.14);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 820px;
      margin: 50px auto;
      padding: 0 20px 40px;
      text-align: center;
      background: var(--sky);
      color: var(--text);
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      color: #e8a33d;
      margin-bottom: 0.4rem;
      line-height: 1.1;
    }

    p {
      font-size: 1.1rem;
      margin: 0.45rem 0;
    }

    .hero-art {
      display: block;
      max-width: 240px;
      width: 100%;
      height: auto;
      margin: 0 auto 24px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.08));
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 20px 18px 18px;
      margin-top: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #message {
      min-height: 28px;
      font-weight: 700;
      color: var(--text);
    }

    button {
      font-size: 1rem;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--banana-dark);
      color: white;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    button:hover {
      background: #c77f1a;
      transform: translateY(-1px);
    }

    #hud {
      max-width: 720px;
      margin: 14px auto 0;
      display: none;
      justify-content: space-between;
      font-weight: 800;
      color: var(--text);
      background: rgba(255,255,255,0.55);
      border-radius: 10px;
      padding: 10px 14px;
    }

    #gameCanvas {
      display: none;
      width: 100%;
      max-width: 720px;
      background: linear-gradient(#bfe3ff, #dff9c5 62%, #9ad96a 62%, #5ab153 100%);
      border: 6px solid #e9c56f;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(89, 56, 16, 0.15);
      margin: 18px auto 0;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <h1>🍌 BANANA BABY<br>The Game 🍌</h1>
  <p>CAN YOU SAVE COCONUT ISLAND?</p>
  <p><img class="hero-art" src="banana_baby.png" alt="Banana Baby illustration"></p>

  <div class="box">
    <p id="message">Get ready for BANANA BABY The Game!</p>
    <button id="startButton" type="button">START GAME</button>
  </div>

  <div id="hud">
    <span id="scoreText">Score: 0</span>
    <span id="livesText">Lives: 3</span>
  </div>

  <canvas id="gameCanvas" width="720" height="420" aria-label="Banana Baby shooter game canvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const startButton = document.getElementById('startButton');
    const hud = document.getElementById('hud');
    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');

    const playerImage = new Image();
    playerImage.src = 'banana_baby.png';

    const keys = {};

    const game = {
      started: false,
      over: false,
      score: 0,
      lives: 3,
      targetScore: 18,
      lastTime: 0,
      spawnTimer: 0,
      player: { x: 360, y: 350, r: 26, speed: 6 },
      enemies: [],
      bullets: [],
      particles: []
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getPointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    function makeEnemy() {
      return {
        x: 50 + Math.random() * (canvas.width - 100),
        y: -20,
        r: 18 + Math.random() * 12,
        speed: 1.4 + Math.random() * 1.4,
        drift: Math.random() * Math.PI * 2,
        phase: Math.random() * 100,
        bag: Math.random() > 0.5
      };
    }

    function resetGame() {
      game.started = true;
      game.over = false;
      game.score = 0;
      game.lives = 3;
      game.spawnTimer = 0;
      game.enemies = [];
      game.bullets = [];
      game.particles = [];
      game.player.x = canvas.width / 2;
      game.player.y = canvas.height - 50;

      scoreText.textContent = 'Score: 0';
      livesText.textContent = 'Lives: 3';
      messageEl.textContent = 'Tap the Fruit Fly Guys and blast them with banana shots!';
      startButton.textContent = 'PLAY AGAIN';
      hud.style.display = 'flex';
      canvas.style.display = 'block';
    }

    function shootBanana(targetX, targetY) {
      if (!game.started || game.over) return;
      game.bullets.push({
        x: game.player.x,
        y: game.player.y - 12,
        targetX,
        targetY,
        speed: 10,
        radius: 7,
        trail: []
      });
    }

    function hitEnemy(enemyIndex) {
      const enemy = game.enemies[enemyIndex];
      for (let i = 0; i < 18; i++) {
        game.particles.push({
          x: enemy.x,
          y: enemy.y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 20 + Math.random() * 18,
          color: '#dca739'
        });
      }
      game.enemies.splice(enemyIndex, 1);
      game.score += 1;
      scoreText.textContent = 'Score: ' + game.score;

      if (game.score >= game.targetScore) {
        game.over = true;
        messageEl.textContent = 'You saved Coconut Island! Banana Baby wins!';
        startButton.textContent = 'PLAY AGAIN';
      } else {
        messageEl.textContent = 'Direct hit! The Fruit Fly Guy was defeated!';
      }
    }

    function handleMovement() {
      let dx = 0;
      let dy = 0;

      if (keys['arrowright'] || keys['d']) dx += 1;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;
      if (keys['arrowup'] || keys['w']) dy -= 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy) || 1;
        game.player.x += (dx / length) * game.player.speed;
        game.player.y += (dy / length) * game.player.speed;
      }

      game.player.x = clamp(game.player.x, 52, canvas.width - 52);
      game.player.y = clamp(game.player.y, 42, canvas.height - 42);
    }

    function updateBullets() {
      for (let i = game.bullets.length - 1; i >= 0; i--) {
        const bullet = game.bullets[i];
        bullet.trail.push({ x: bullet.x, y: bullet.y });
        if (bullet.trail.length > 8) bullet.trail.shift();

        const dx = bullet.targetX - bullet.x;
        const dy = bullet.targetY - bullet.y;
        const dist = Math.hypot(dx, dy) || 1;

        if (dist <= bullet.speed + 1) {
          for (let j = 0; j < game.enemies.length; j++) {
            const enemy = game.enemies[j];
            if (Math.hypot(enemy.x - bullet.targetX, enemy.y - bullet.targetY) <= enemy.r + 8) {
              hitEnemy(j);
              game.bullets.splice(i, 1);
              return;
            }
          }
        }

        bullet.x += (dx / dist) * bullet.speed;
        bullet.y += (dy / dist) * bullet.speed;

        if (bullet.x < -10 || bullet.x > canvas.width + 10 || bullet.y < -10 || bullet.y > canvas.height + 10) {
          game.bullets.splice(i, 1);
        }
      }
    }

    function updateEnemies() {
      game.spawnTimer += 1;
      if (game.spawnTimer > 46) {
        game.spawnTimer = 0;
        if (game.enemies.length < 10) {
          game.enemies.push(makeEnemy());
        }
      }

      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const enemy = game.enemies[i];
        enemy.y += enemy.speed;
        enemy.x += Math.sin((enemy.y + enemy.phase) * 0.12) * 2.1;

        if (enemy.y > canvas.height - 18) {
          game.enemies.splice(i, 1);
          game.lives -= 1;
          livesText.textContent = 'Lives: ' + game.lives;
          messageEl.textContent = 'A Fruit Fly Guy stole cash! Watch out!';

          if (game.lives <= 0) {
            game.over = true;
            messageEl.textContent = 'Banana Baby got overwhelmed. Press PLAY AGAIN!';
            startButton.textContent = 'PLAY AGAIN';
          }
        }
      }
    }

    function updateParticles() {
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) {
          game.particles.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#bfe9ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#7ecf72';
      ctx.fillRect(0, canvas.height * 0.72, canvas.width, canvas.height * 0.28);

      for (let i = 0; i < 14; i++) {
        const x = (i * 60) % canvas.width;
        const y = canvas.height * 0.74 + (i % 3) * 12;
        ctx.fillStyle = '#6bbf59';
        ctx.fillRect(x, y, 22, 30);
      }
    }

    function drawPlayer() {
      const { x, y, r } = game.player;

      if (playerImage.complete && playerImage.naturalWidth > 0) {
        ctx.drawImage(playerImage, x - 28, y - 28, 56, 56);
        return;
      }

      ctx.fillStyle = '#f6cf5d';
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.95, r * 1.05, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d4a126';
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 10);
      ctx.lineTo(x + 12, y - 18);
      ctx.lineTo(x + 10, y - 4);
      ctx.lineTo(x - 10, y - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x - 7, y - 4, 2.3, 0, Math.PI * 2);
      ctx.arc(x + 7, y - 4, 2.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y + 6, 6, 0.1, Math.PI - 0.1);
      ctx.stroke();
    }

    function drawEnemy(enemy) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(-12, -2, 18, 10, -0.6, 0, Math.PI * 2);
      ctx.ellipse(12, -2, 18, 10, 0.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7b7b7b';
      ctx.beginPath();
      ctx.ellipse(0, 6, 17, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5c5c5c';
      ctx.beginPath();
      ctx.arc(0, -10, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f8d7d7';
      ctx.beginPath();
      ctx.arc(-5, -12, 4.5, 0, Math.PI * 2);
      ctx.arc(5, -12, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d84545';
      ctx.beginPath();
      ctx.arc(-5, -12, 2.2, 0, Math.PI * 2);
      ctx.arc(5, -12, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-12, 3);
      ctx.lineTo(-22, 18);
      ctx.moveTo(12, 3);
      ctx.lineTo(22, 18);
      ctx.moveTo(-8, 16);
      ctx.lineTo(-12, 26);
      ctx.moveTo(8, 16);
      ctx.lineTo(12, 26);
      ctx.stroke();

      if (enemy.bag) {
        ctx.fillStyle = '#a78d67';
        ctx.fillRect(12, 2, 10, 12);
        ctx.fillStyle = '#ffe5b2';
        ctx.fillRect(13, 4, 8, 8);
      }

      ctx.fillStyle = '#2c2c2c';
      ctx.fillRect(-4, 22, 8, 4);

      ctx.restore();
    }

    function drawBullet(bullet) {
      bullet.trail.forEach((point, index) => {
        ctx.fillStyle = 'rgba(255, 200, 70, ' + (0.2 + index / bullet.trail.length) + ')';
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#f4d35e';
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticles() {
      for (const p of game.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 35);
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }
    }

    function draw() {
      drawBackground();
      for (const enemy of game.enemies) drawEnemy(enemy);
      for (const bullet of game.bullets) drawBullet(bullet);
      drawParticles();
      drawPlayer();
    }

    function gameLoop(timestamp) {
      if (game.lastTime === 0) game.lastTime = timestamp;
      const delta = Math.min((timestamp - game.lastTime) / 16.7 || 1, 1.6);
      game.lastTime = timestamp;

      if (game.started && !game.over) {
        handleMovement();
        updateEnemies();
        updateBullets();
        updateParticles();
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function onCanvasClick(event) {
      if (!game.started || game.over) return;
      const pointer = getPointerPosition(event);
      let targetHit = false;

      for (let i = 0; i < game.enemies.length; i++) {
        const enemy = game.enemies[i];
        if (Math.hypot(pointer.x - enemy.x, pointer.y - enemy.y) <= enemy.r + 12) {
          targetHit = true;
          shootBanana(enemy.x, enemy.y);
          break;
        }
      }

      if (!targetHit) {
        shootBanana(pointer.x, pointer.y);
      }
    }

    startButton.addEventListener('click', resetGame);
    canvas.addEventListener('click', onCanvasClick);

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      keys[key] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) {
        event.preventDefault();
      }
    });

    window.addEventListener('keyup', (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
