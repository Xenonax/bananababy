<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banana Baby The Game</title>
  <style>
    :root {
      --banana: #f5c76b;
      --banana-dark: #de9a2d;
      --sky: #fffbe8;
      --grass: #6bbd63;
      --text: #3b2a1d;
      --panel: rgba(255,255,255,0.75);
      --danger: #d64545;
      --accent: #8d5fc2;
      --shadow: rgba(0,0,0,0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--sky);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      max-width: 820px;
      margin: 40px auto 30px;
      padding: 0 18px 30px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.2rem, 4vw, 3rem);
      line-height: 1.08;
      color: #e8a33d;
    }

    p {
      margin: 8px 0;
      font-size: 1.08rem;
    }

    .box {
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 18px 16px 20px;
      margin-top: 14px;
    }

    #message {
      min-height: 26px;
      font-weight: 800;
      color: var(--text);
    }

    .subtitle {
      min-height: 24px;
      color: #7a4b18;
      font-size: 0.96rem;
      font-weight: 800;
      opacity: 0.9;
    }

    button {
      font-size: 1rem;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--banana-dark);
      color: white;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-top: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #c77f1a;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      max-width: 720px;
      margin: 14px auto 0;
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 720px;
      margin: 18px auto 0;
      background: linear-gradient(#bfe3ff, #dff9c5 62%, #9ad96a 62%, #5ab153 100%);
      border: 6px solid #e9c56f;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(89, 56, 16, 0.15);
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <h1>🍌 BANANA BABY<br>The Game 🍌</h1>
  <p>CAN YOU SAVE COCONUT ISLAND?</p>

  <div class="box">
    <p id="message">Get ready for Banana Baby The Game!</p>
    <div id="subtitle" class="subtitle">Fruit Fly threat incoming...</div>
    <button id="startButton" type="button">START GAME</button>
  </div>

  <div id="hud">
    <span id="scoreText">Score: 0</span>
    <span id="comboText">Combo: x1</span>
    <span id="livesText">Lives: 5</span>
  </div>

  <canvas id="gameCanvas" width="720" height="420" aria-label="Banana Baby shooter game"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const subtitleEl = document.getElementById('subtitle');
    const startButton = document.getElementById('startButton');
    const scoreText = document.getElementById('scoreText');
    const comboText = document.getElementById('comboText');
    const livesText = document.getElementById('livesText');

    const keys = {};
    const state = {
      started: false,
      gameOver: false,
      score: 0,
      lives: 5,
      combo: 1,
      comboTimer: 0,
      player: { x: 360, y: 350, r: 24, speed: 6, vx: 0, vy: 0 },
      bullets: [],
      enemies: [],
      particles: [],
      boss: null,
      bossIndex: 0,
      bossGoal: 2,
      bossNames: ['Fruit Fly King', 'Fruit Fly Queen'],
      clouds: [],
      pointer: null,
      drag: false,
      enemyShots: [],
      lastTime: 0,
      waveTimer: 0,
      bossSpawned: false,
      bossDefeated: false,
      bossDefeatCount: 0,
      subtitleTimer: 0
    };

    function rand(min, max) { return min + Math.random() * (max - min); }
    function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

    function setSubtitle(text, duration = 120) {
      subtitleEl.textContent = text;
      state.subtitleTimer = duration;
      subtitleEl.style.opacity = '1';
    }

    function updateCombo() {
      if (state.comboTimer > 0) {
        state.comboTimer -= 1;
      } else if (state.combo > 1) {
        state.combo = 1;
        comboText.textContent = 'Combo: x1';
      }

      if (state.subtitleTimer > 0) {
        state.subtitleTimer -= 1;
      } else {
        subtitleEl.style.opacity = '0.8';
      }
    }

    function initClouds() {
      state.clouds = [];
      for (let i = 0; i < 8; i++) {
        state.clouds.push({
          x: rand(0, canvas.width),
          y: rand(20, 150),
          r: rand(20, 40),
          speed: rand(0.3, 0.8),
          alpha: rand(0.2, 0.5)
        });
      }
    }

    function makeEnemy() {
      return {
        x: rand(60, canvas.width - 60),
        y: -20,
        r: rand(16, 28),
        speed: rand(1.4, 2.6),
        phase: Math.random() * 100,
        z: rand(0.7, 1.8),
        tilt: rand(-0.7, 0.7),
        boss: false
      };
    }

    function makeBoss(variant = 'king') {
      const isQueen = variant === 'queen';
      return {
        x: canvas.width / 2,
        y: -60,
        r: 46,
        speed: 1.2,
        health: 12,
        phase: 0,
        tilt: 0,
        z: 1.6,
        fireCooldown: 70,
        boss: true,
        variant,
        name: isQueen ? 'Fruit Fly Queen' : 'Fruit Fly King',
        label: isQueen ? 'FRUIT FLY QUEEN' : 'FRUIT FLY KING'
      };
    }

    function resetGame() {
      state.started = true;
      state.gameOver = false;
      state.score = 0;
      state.lives = 5;
      state.combo = 1;
      state.comboTimer = 0;
      state.bullets = [];
      state.enemies = [];
      state.particles = [];
      state.enemyShots = [];
      state.boss = null;
      state.bossIndex = 0;
      state.bossGoal = 2;
      state.bossSpawned = false;
      state.bossDefeated = false;
      state.bossDefeatCount = 0;
      state.waveTimer = 0;
      state.player.x = canvas.width / 2;
      state.player.y = canvas.height - 50;
      initClouds();

      scoreText.textContent = 'Score: 0';
      comboText.textContent = 'Combo: x1';
      livesText.textContent = 'Lives: 5';
      messageEl.textContent = 'Tap the Fruit Fly guys and blast them with banana shots!';
      setSubtitle('Two royal bosses stand between you and victory.', 180);
      startButton.textContent = 'PLAY AGAIN';
      requestAnimationFrame(loop);
    }

    function shootBanana(targetX, targetY) {
      if (!state.started || state.gameOver) return;
      state.bullets.push({
        x: state.player.x,
        y: state.player.y - 10,
        targetX,
        targetY,
        speed: 9.5,
        radius: 6,
        trail: []
      });
    }

    function spawnEnemyShot(enemy) {
      state.enemyShots.push({
        x: enemy.x,
        y: enemy.y + 12,
        targetX: state.player.x,
        targetY: state.player.y,
        speed: 4.2,
        radius: 8
      });
    }

    function maybeSpawnBoss() {
      if (state.gameOver || state.boss || state.bossDefeated) return;
      if (state.score < 2 + state.bossDefeatCount * 3) return;
      if (state.bossDefeatCount >= state.bossGoal) return;
      const variant = state.bossDefeatCount === 0 ? 'king' : 'queen';
      state.boss = makeBoss(variant);
      state.enemies.push(state.boss);
      state.bossSpawned = true;
      messageEl.textContent = 'Boss fight! ' + state.boss.name + ' is here!';
      setSubtitle('Boss ' + (state.bossDefeatCount + 1) + ' arrives!', 160);
    }

    function killEnemy(index, bossKill = false) {
      const enemy = state.enemies[index];
      if (!enemy) return;

      if (bossKill) {
        for (let i = 0; i < 24; i++) {
          state.particles.push({
            x: enemy.x,
            y: enemy.y,
            vx: rand(-4, 4),
            vy: rand(-4, 4),
            life: rand(24, 52),
            color: enemy.variant === 'queen' ? '#8d5fc2' : '#f3c76d'
          });
        }

        state.enemies.splice(index, 1);
        state.score += 10 * state.combo;
        state.boss = null;
        state.bossSpawned = false;
        state.bossDefeatCount += 1;
        scoreText.textContent = 'Score: ' + state.score;

        if (state.bossDefeatCount >= state.bossGoal) {
          state.gameOver = true;
          messageEl.textContent = 'You saved Coconut Island! The Fruit Fly Queen is defeated!';
          startButton.textContent = 'PLAY AGAIN';
          setSubtitle('Final boss defeated! The island is safe!', 180);
          return;
        }

        messageEl.textContent = 'Boss defeated! Another royal threat is coming!';
        setSubtitle('Next boss incoming...', 180);
        return;
      }

      for (let i = 0; i < 12; i++) {
        state.particles.push({
          x: enemy.x,
          y: enemy.y,
          vx: rand(-3, 3),
          vy: rand(-3, 3),
          life: rand(18, 34),
          color: '#dca739'
        });
      }

      state.enemies.splice(index, 1);
      state.score += 1 * state.combo;
      scoreText.textContent = 'Score: ' + state.score;
      if (state.combo < 6) {
        state.combo = Math.min(state.combo + 1, 6);
        comboText.textContent = 'Combo: x' + state.combo;
        state.comboTimer = 120;
      }
    }

    function hitEnemy(index) {
      const enemy = state.enemies[index];
      if (!enemy) return;

      if (enemy.boss) {
        enemy.health -= 1;
        if (enemy.health <= 0) {
          killEnemy(index, true);
        } else {
          messageEl.textContent = 'Boss hit! Keep piling on the damage!';
          setSubtitle('Boss is still standing! Keep attacking!', 110);
        }
        return;
      }

      killEnemy(index, false);
    }

    function updatePlayer() {
      let dx = 0;
      let dy = 0;
      if (keys['arrowright'] || keys['d']) dx += 1;
      if (keys['arrowleft'] || keys['a']) dx -= 1;
      if (keys['arrowdown'] || keys['s']) dy += 1;
      if (keys['arrowup'] || keys['w']) dy -= 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy) || 1;
        state.player.x += (dx / length) * state.player.speed;
        state.player.y += (dy / length) * state.player.speed;
      }

      state.player.x = clamp(state.player.x, 40, canvas.width - 40);
      state.player.y = clamp(state.player.y, 40, canvas.height - 40);
    }

    function updateBullets() {
      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        const dx = bullet.targetX - bullet.x;
        const dy = bullet.targetY - bullet.y;
        const dist = Math.hypot(dx, dy) || 1;

        bullet.x += (dx / dist) * bullet.speed;
        bullet.y += (dy / dist) * bullet.speed;

        bullet.trail.push({ x: bullet.x, y: bullet.y });
        if (bullet.trail.length > 7) bullet.trail.shift();

        for (let j = 0; j < state.enemies.length; j++) {
          const enemy = state.enemies[j];
          if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) <= enemy.r + 8) {
            hitEnemy(j);
            state.bullets.splice(i, 1);
            break;
          }
        }

        if (state.bullets[i] && (bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20)) {
          state.bullets.splice(i, 1);
        }
      }
    }

    function updateEnemyShots() {
      for (let i = state.enemyShots.length - 1; i >= 0; i--) {
        const shot = state.enemyShots[i];
        const dx = shot.targetX - shot.x;
        const dy = shot.targetY - shot.y;
        const dist = Math.hypot(dx, dy) || 1;

        shot.x += (dx / dist) * shot.speed;
        shot.y += (dy / dist) * shot.speed;

        if (Math.hypot(shot.x - state.player.x, shot.y - state.player.y) <= 20) {
          state.enemyShots.splice(i, 1);
          state.lives -= 1;
          livesText.textContent = 'Lives: ' + state.lives;
          messageEl.textContent = 'The boss shot you! Stay moving!';
          setSubtitle('That one hurt! Keep it moving!', 120);
          if (state.lives <= 0) {
            state.gameOver = true;
            messageEl.textContent = 'Banana Baby got overwhelmed. Press PLAY AGAIN!';
            startButton.textContent = 'PLAY AGAIN';
          }
          continue;
        }

        if (shot.x < -20 || shot.x > canvas.width + 20 || shot.y < -20 || shot.y > canvas.height + 20) {
          state.enemyShots.splice(i, 1);
        }
      }
    }

    function updateEnemies() {
      state.waveTimer += 1;
      if (!state.boss && !state.gameOver && state.waveTimer > 55) {
        state.waveTimer = 0;
        const normalCount = state.enemies.filter(e => !e.boss).length;
        if (normalCount < 4) {
          state.enemies.push(makeEnemy());
        }
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const enemy = state.enemies[i];

        if (enemy.boss) {
          enemy.phase += 0.08;
          enemy.x += Math.sin(enemy.phase) * 2.4;
          enemy.y = Math.min(enemy.y + enemy.speed * 1.3, 110);
          enemy.tilt = Math.sin(enemy.phase) * 0.5;
          enemy.fireCooldown -= 1;

          if (enemy.fireCooldown <= 0) {
            spawnEnemyShot(enemy);
            enemy.fireCooldown = 80;
          }

          if (enemy.x < 50 || enemy.x > canvas.width - 50) {
            enemy.x = clamp(enemy.x, 50, canvas.width - 50);
          }

          if (enemy.health <= 0) {
            hitEnemy(i);
          }
          continue;
        }

        enemy.y += enemy.speed * 1.15;
        enemy.x += Math.sin((enemy.y + enemy.phase) * 0.15) * 2.2;

        if (enemy.y > canvas.height - 16) {
          state.enemies.splice(i, 1);
          state.lives -= 1;
          livesText.textContent = 'Lives: ' + state.lives;
          messageEl.textContent = 'A Fruit Fly bug got through!';
          setSubtitle('No! Another one slipped through!', 120);
          if (state.lives <= 0) {
            state.gameOver = true;
            messageEl.textContent = 'Banana Baby got overwhelmed. Press PLAY AGAIN!';
            startButton.textContent = 'PLAY AGAIN';
          }
        }
      }
    }

    function updateParticles() {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) state.particles.splice(i, 1);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#bfe9ff');
      sky.addColorStop(0.7, '#dff9c5');
      sky.addColorStop(0.7, '#9ad96a');
      sky.addColorStop(1, '#5ab153');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const cloud of state.clouds) {
        ctx.fillStyle = `rgba(255,255,255,${cloud.alpha})`;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.r * 0.8, cloud.y + 8, cloud.r * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.r * 0.7, cloud.y + 5, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
        cloud.x += cloud.speed;
        if (cloud.x > canvas.width + cloud.r) cloud.x = -cloud.r;
      }

      ctx.fillStyle = '#7ecf72';
      ctx.fillRect(0, canvas.height * 0.72, canvas.width, canvas.height * 0.28);
      for (let i = 0; i < 18; i++) {
        const x = (i * 46) % canvas.width;
        const y = canvas.height * 0.76 + (i % 3) * 12;
        ctx.fillStyle = '#6bbf59';
        ctx.fillRect(x, y, 26, 30);
      }
    }

    function drawPlayer() {
      const { x, y, r } = state.player;

      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.beginPath();
      ctx.ellipse(x, y + 25, 34, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#f6cf5d';
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.9, r * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d4a126';
      ctx.beginPath();
      ctx.moveTo(-12, -10); ctx.lineTo(12, -18); ctx.lineTo(10, -4); ctx.lineTo(-10, -2); ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-7, -4, 2.3, 0, Math.PI * 2);
      ctx.arc(7, -4, 2.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 6, 6, 0.2, Math.PI - 0.2);
      ctx.stroke();
      ctx.restore();
    }

    function drawBossBar() {
      if (!state.boss) return;

      const width = 220;
      const x = (canvas.width - width) / 2;
      const y = 18;
      const hpRatio = clamp(state.boss.health / 12, 0, 1);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x, y, width, 18);
      ctx.fillStyle = state.boss.variant === 'queen' ? '#8d5fc2' : '#d64545';
      ctx.fillRect(x + 2, y + 2, (width - 4) * hpRatio, 14);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(state.boss.label, x + 42, y + 13);
    }

    function drawBoss(enemy) {
      const isQueen = enemy.variant === 'queen';
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.tilt);

      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(0, enemy.r + 18, enemy.r * 1.7, enemy.r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      const bodyColor = isQueen ? '#6c5ab5' : '#7f7f7f';
      const headColor = isQueen ? '#604fa8' : '#5e5e5e';
      const goldColor = isQueen ? '#ebe0ff' : '#c2a15a';
      const trimColor = isQueen ? '#7ce2d4' : '#d9d9d9';
      const accentColor = isQueen ? '#8ef0d8' : '#9a6b2b';

      if (isQueen) {
        ctx.fillStyle = 'rgba(124, 226, 212, 0.22)';
        ctx.beginPath();
        ctx.ellipse(-56, -8, 28, 18, -0.9, 0, Math.PI * 2);
        ctx.ellipse(56, -8, 28, 18, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 42, 26, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = headColor;
      ctx.beginPath();
      ctx.arc(0, -30, 32, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f6d3d3';
      ctx.beginPath();
      ctx.arc(-12, -32, 7, 0, Math.PI * 2);
      ctx.arc(12, -32, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d64545';
      ctx.beginPath();
      ctx.arc(-12, -32, 3.5, 0, Math.PI * 2);
      ctx.arc(12, -32, 3.5, 0, Math.PI * 2);
      ctx.fill();

      if (isQueen) {
        ctx.fillStyle = '#f7e6a3';
        ctx.beginPath();
        ctx.moveTo(-18, -54);
        ctx.lineTo(-10, -64);
        ctx.lineTo(-2, -54);
        ctx.lineTo(6, -64);
        ctx.lineTo(16, -54);
        ctx.lineTo(20, -46);
        ctx.lineTo(-20, -46);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#8ef0d8';
        ctx.fillRect(-14, -62, 6, 8);
        ctx.fillRect(-2, -66, 6, 10);
        ctx.fillRect(10, -62, 6, 8);
      }

      ctx.fillStyle = goldColor;
      ctx.fillRect(-10, -45, 20, 8);
      ctx.fillStyle = trimColor;
      ctx.fillRect(-32, 10, 18, 8);
      ctx.fillRect(14, 10, 18, 8);
      ctx.fillRect(-42, -8, 12, 5);
      ctx.fillRect(30, -8, 12, 5);

      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-24, 0); ctx.lineTo(-40, 26);
      ctx.moveTo(24, 0); ctx.lineTo(40, 26);
      ctx.moveTo(-18, 18); ctx.lineTo(-18, 34);
      ctx.moveTo(18, 18); ctx.lineTo(18, 34);
      ctx.stroke();

      ctx.fillStyle = accentColor;
      ctx.fillRect(-12, 28, 24, 7);
      ctx.fillStyle = '#2f2f2f';
      ctx.fillRect(-5, 34, 10, 8);

      if (isQueen) {
        ctx.fillStyle = '#d8d4ff';
        ctx.fillRect(-34, -10, 14, 5);
        ctx.fillRect(20, -10, 14, 5);
        ctx.fillStyle = '#7ce2d4';
        ctx.fillRect(-47, 0, 10, 6);
        ctx.fillRect(37, 0, 10, 6);
        ctx.fillStyle = '#d9c1ff';
        ctx.fillRect(-18, 6, 14, 16);
        ctx.fillRect(4, 6, 14, 16);
      } else {
        ctx.fillStyle = '#9a6b2b';
        ctx.fillRect(18, 6, 14, 16);
      }

      ctx.restore();
    }

    function drawEnemy(enemy) {
      if (enemy.boss) {
        drawBoss(enemy);
        return;
      }

      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.scale(1, 1 + (enemy.z - 1) * 0.35);
      ctx.rotate(enemy.tilt);

      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, enemy.r + 14, enemy.r * 1.5, enemy.r * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7b7b7b';
      ctx.beginPath();
      ctx.ellipse(0, 6, 17, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5c5c5c';
      ctx.beginPath();
      ctx.arc(0, -10, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f8d7d7';
      ctx.beginPath();
      ctx.arc(-5, -12, 4.5, 0, Math.PI * 2);
      ctx.arc(5, -12, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d84545';
      ctx.beginPath();
      ctx.arc(-5, -12, 2.2, 0, Math.PI * 2);
      ctx.arc(5, -12, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, 16); ctx.lineTo(-28, 27);
      ctx.moveTo(14, 16); ctx.lineTo(28, 27);
      ctx.moveTo(-8, 22); ctx.lineTo(-8, 34);
      ctx.moveTo(8, 22); ctx.lineTo(8, 34);
      ctx.stroke();

      ctx.fillStyle = '#a1a1a1';
      ctx.fillRect(-8, 0, 16, 10);
      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of state.bullets) {
        for (let i = 0; i < bullet.trail.length; i++) {
          const t = bullet.trail[i];
          ctx.fillStyle = `rgba(169, 121, 42, ${i / bullet.trail.length})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#f3c76d';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemyShots() {
      for (const shot of state.enemyShots) {
        ctx.fillStyle = '#d64545';
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 60);
        ctx.fillRect(p.x, p.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      drawParticles();
      drawBullets();
      drawEnemyShots();
      for (const enemy of state.enemies) drawEnemy(enemy);
      drawPlayer();
      drawBossBar();
    }

    function update() {
      if (!state.started || state.gameOver) return;
      updateCombo();
      updatePlayer();
      updateBullets();
      updateEnemyShots();
      updateEnemies();
      maybeSpawnBoss();
      updateParticles();
      draw();
    }

    function loop() {
      update();
      requestAnimationFrame(loop);
    }

    function onKeyState(event, value) {
      const key = event.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
        event.preventDefault();
      }
      keys[key] = value;
    }

    document.addEventListener('keydown', (event) => onKeyState(event, true));
    document.addEventListener('keyup', (event) => onKeyState(event, false));
    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      state.pointer = { x, y };
      state.drag = true;
      shootBanana(x, y);
    });
    canvas.addEventListener('pointermove', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      state.pointer = { x, y };
      if (state.drag) shootBanana(x, y);
    });
    canvas.addEventListener('pointerup', () => { state.drag = false; });
    canvas.addEventListener('pointerleave', () => { state.drag = false; });

    startButton.addEventListener('click', () => {
      resetGame();
    });

    initClouds();
    draw();
  </script>
</body>
</html>
