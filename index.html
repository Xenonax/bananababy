<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banana Baby The Game</title>
  <style>
    :root {
      --banana: #f5c76b;
      --banana-dark: #de9a2d;
      --sky: #fffbe8;
      --grass: #6bbd63;
      --text: #3b2a1d;
      --panel: rgba(255,255,255,0.7);
      --danger: #d64545;
      --shadow: rgba(0,0,0,0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--sky);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      max-width: 820px;
      margin: 50px auto 30px;
      padding: 0 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3rem);
      color: #e8a33d;
      margin-bottom: 0.4rem;
      line-height: 1.1;
    }

    p {
      font-size: 1.1rem;
      margin: 0.45rem 0;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 20px 18px 18px;
      margin-top: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #message {
      min-height: 28px;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      min-height: 24px;
      font-weight: 700;
      color: #7a4b18;
      font-size: 0.96rem;
      letter-spacing: 0.02em;
      opacity: 0.95;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    button {
      font-size: 1rem;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: var(--banana-dark);
      color: white;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    button:hover {
      background: #c77f1a;
      transform: translateY(-1px);
    }

    #hud {
      display: flex;
      justify-content: space-between;
      max-width: 720px;
      margin: 14px auto 0;
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 720px;
      margin: 18px auto 0;
      background: linear-gradient(#bfe3ff, #dff9c5 62%, #9ad96a 62%, #5ab153 100%);
      border: 6px solid #e9c56f;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(89, 56, 16, 0.15);
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <h1>🍌 Banana Baby<br>The Game</h1>
  <p>Protect the island from the fruit flies.</p>

  <div class="box">
    <p id="message">Get ready for Banana Baby The Game!</p>
    <div id="subtitle" class="subtitle">Fruit Fly swarm incoming...</div>
    <button id="startButton" type="button">START GAME</button>
  </div>

  <div id="hud">
    <span id="scoreText">Score: 0</span>
    <span id="livesText">Lives: 5</span>
  </div>

  <canvas id="gameCanvas" width="720" height="420" aria-label="Banana Baby game"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageEl = document.getElementById('message');
    const subtitleEl = document.getElementById('subtitle');
    const startButton = document.getElementById('startButton');
    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');

    const state = {
      started: false,
      gameOver: false,
      score: 0,
      lives: 5,
      player: { x: canvas.width / 2, y: canvas.height - 48, radius: 22, targetX: canvas.width / 2, targetY: canvas.height - 48 },
      bullets: [],
      enemies: [],
      bosses: [],
      projectiles: [],
      particles: [],
      clouds: [],
      spawnTimer: 0,
      bossTimer: 0,
      bossWarning: 0,
      pointerActive: false
    };

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setSubtitle(text) {
      subtitleEl.textContent = text;
    }

    function initClouds() {
      state.clouds = [];
      for (let i = 0; i < 8; i++) {
        state.clouds.push({
          x: rand(0, canvas.width),
          y: rand(20, 150),
          r: rand(18, 36),
          speed: rand(0.25, 0.8),
          alpha: rand(0.22, 0.52)
        });
      }
    }

    function resetGame() {
      state.started = true;
      state.gameOver = false;
      state.score = 0;
      state.lives = 5;
      state.bullets = [];
      state.enemies = [];
      state.bosses = [];
      state.projectiles = [];
      state.particles = [];
      state.spawnTimer = 0;
      state.bossTimer = 0;
      state.bossWarning = 0;
      state.player.x = canvas.width / 2;
      state.player.y = canvas.height - 48;
      state.player.targetX = state.player.x;
      state.player.targetY = state.player.y;

      scoreText.textContent = 'Score: 0';
      livesText.textContent = 'Lives: 5';
      messageEl.textContent = 'The fruit flies are here!';
      setSubtitle('Regular flies are distractions. Bosses do the damage.');
      startButton.textContent = 'PLAY AGAIN';
      requestAnimationFrame(loop);
    }

    function shootAtPointer(x, y) {
      if (!state.started || state.gameOver) return;
      state.bullets.push({
        x: state.player.x,
        y: state.player.y - 10,
        tx: x,
        ty: y,
        speed: 8,
        radius: 5,
        trail: []
      });
    }

    function spawnEnemy() {
      if (state.enemies.length >= 4) return;
      state.enemies.push({
        x: rand(40, canvas.width - 40),
        y: -30,
        radius: rand(12, 18),
        speed: rand(0.8, 1.6),
        drift: rand(-1, 1),
        phase: rand(0, Math.PI * 2)
      });
    }

    function spawnBoss() {
      if (state.bosses.length >= 1) return;
      const boss = {
        x: rand(90, canvas.width - 90),
        y: -60,
        radius: rand(28, 36),
        speed: rand(0.7, 1.05),
        drift: rand(-1.2, 1.2),
        phase: rand(0, Math.PI * 2),
        hp: 3,
        shotCooldown: 70
      };
      state.bosses.push(boss);
      state.bossWarning = 120;
      messageEl.textContent = 'BOSS WARNING!';
      setSubtitle('A giant fruit boss is on the way!');
    }

    function explosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        state.particles.push({
          x,
          y,
          vx: rand(-2.4, 2.4),
          vy: rand(-2.4, 2.4),
          life: rand(20, 42),
          color
        });
      }
    }

    function updatePlayer() {
      const dx = state.player.targetX - state.player.x;
      const dy = state.player.targetY - state.player.y;
      const dist = Math.hypot(dx, dy) || 1;
      const moveSpeed = 7.5;

      if (dist > 2) {
        state.player.x += (dx / dist) * moveSpeed;
        state.player.y += (dy / dist) * moveSpeed;
      }

      state.player.x = clamp(state.player.x, 30, canvas.width - 30);
      state.player.y = clamp(state.player.y, 36, canvas.height - 26);
    }

    function updateBullets() {
      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        const dx = bullet.tx - bullet.x;
        const dy = bullet.ty - bullet.y;
        const dist = Math.hypot(dx, dy) || 1;

        bullet.x += (dx / dist) * bullet.speed;
        bullet.y += (dy / dist) * bullet.speed;
        bullet.trail.push({ x: bullet.x, y: bullet.y });
        if (bullet.trail.length > 7) bullet.trail.shift();

        let hitSomething = false;

        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const enemy = state.enemies[j];
          if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) <= enemy.radius + 8) {
            state.enemies.splice(j, 1);
            state.score += 10;
            scoreText.textContent = 'Score: ' + state.score;
            explosion(enemy.x, enemy.y, '#f5c76b');
            hitSomething = true;
            break;
          }
        }

        if (!hitSomething) {
          for (let j = state.bosses.length - 1; j >= 0; j--) {
            const boss = state.bosses[j];
            if (Math.hypot(boss.x - bullet.x, boss.y - bullet.y) <= boss.radius + 8) {
              boss.hp -= 1;
              explosion(boss.x, boss.y, '#d64545');
              setSubtitle(boss.hp > 0 ? 'Boss hit! Keep firing!' : 'Boss down!');
              hitSomething = true;

              if (boss.hp <= 0) {
                state.bosses.splice(j, 1);
                state.score += 50;
                scoreText.textContent = 'Score: ' + state.score;
                explosion(boss.x, boss.y, '#ffc857');
                messageEl.textContent = 'The boss is down!';
              }
              break;
            }
          }
        }

        if (hitSomething) {
          state.bullets.splice(i, 1);
          continue;
        }

        if (state.bullets[i] && (bullet.x < -20 || bullet.x > canvas.width + 20 || bullet.y < -20 || bullet.y > canvas.height + 20)) {
          state.bullets.splice(i, 1);
        }
      }
    }

    function updateProjectiles() {
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const p = state.projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (Math.hypot(p.x - state.player.x, p.y - state.player.y) <= p.radius + state.player.radius) {
          state.projectiles.splice(i, 1);
          state.lives -= 1;
          livesText.textContent = 'Lives: ' + state.lives;
          explosion(state.player.x, state.player.y, '#d64545');
          setSubtitle('Boss projectile hit!');
          if (state.lives <= 0) {
            state.gameOver = true;
            messageEl.textContent = 'Banana Baby was overwhelmed. Press PLAY AGAIN!';
            setSubtitle('Try again and stay on the move.');
            startButton.textContent = 'PLAY AGAIN';
          }
          continue;
        }

        if (p.x < -30 || p.x > canvas.width + 30 || p.y < -30 || p.y > canvas.height + 30) {
          state.projectiles.splice(i, 1);
        }
      }
    }

    function updateEnemies() {
      state.spawnTimer += 1;
      if (state.spawnTimer > 90) {
        state.spawnTimer = 0;
        spawnEnemy();
      }

      state.bossTimer += 1;
      if (state.bossTimer > 420) {
        state.bossTimer = 0;
        spawnBoss();
      }

      if (state.bossWarning > 0) {
        state.bossWarning -= 1;
        if (state.bossWarning === 0) {
          setSubtitle('Boss incoming!');
        }
      }

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const enemy = state.enemies[i];
        enemy.y += enemy.speed;
        enemy.x += Math.sin((enemy.y + enemy.phase) * 0.04) * enemy.drift * 1.6;

        if (enemy.y > canvas.height + 30) {
          state.enemies.splice(i, 1);
          setSubtitle('Distractor lost. Keep moving!');
        }
      }

      for (let i = state.bosses.length - 1; i >= 0; i--) {
        const boss = state.bosses[i];
        boss.y += boss.speed;
        boss.x += Math.sin((boss.y + boss.phase) * 0.05) * boss.drift * 2.4;

        if (boss.shotCooldown > 0) {
          boss.shotCooldown -= 1;
        } else {
          const dx = state.player.x - boss.x;
          const dy = state.player.y - boss.y;
          const dist = Math.hypot(dx, dy) || 1;
          const vx = (dx / dist) * 2.8;
          const vy = (dy / dist) * 2.8;
          state.projectiles.push({
            x: boss.x,
            y: boss.y + 10,
            vx,
            vy,
            radius: 6,
            color: '#fb7185'
          });
          boss.shotCooldown = rand(55, 90);
        }

        if (Math.hypot(boss.x - state.player.x, boss.y - state.player.y) <= boss.radius + state.player.radius) {
          state.bosses.splice(i, 1);
          state.lives -= 1;
          livesText.textContent = 'Lives: ' + state.lives;
          explosion(state.player.x, state.player.y, '#d64545');
          setSubtitle('Boss clipped you!');
          if (state.lives <= 0) {
            state.gameOver = true;
            messageEl.textContent = 'Banana Baby was overwhelmed. Press PLAY AGAIN!';
            setSubtitle('Try again and stay on the move.');
            startButton.textContent = 'PLAY AGAIN';
          }
          continue;
        }

        if (boss.y > canvas.height + 50) {
          state.bosses.splice(i, 1);
          state.lives -= 1;
          livesText.textContent = 'Lives: ' + state.lives;
          setSubtitle('Boss slipped through!');
          if (state.lives <= 0) {
            state.gameOver = true;
            messageEl.textContent = 'Banana Baby was overwhelmed. Press PLAY AGAIN!';
            setSubtitle('Try again and stay on the move.');
            startButton.textContent = 'PLAY AGAIN';
          }
        }
      }
    }

    function updateParticles() {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) {
          state.particles.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#bfe9ff');
      sky.addColorStop(0.65, '#dff9c5');
      sky.addColorStop(0.66, '#9ad96a');
      sky.addColorStop(1, '#5ab153');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const cloud of state.clouds) {
        ctx.fillStyle = `rgba(255,255,255,${cloud.alpha})`;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.r * 0.8, cloud.y + 8, cloud.r * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.r * 0.7, cloud.y + 5, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
        cloud.x += cloud.speed;
        if (cloud.x > canvas.width + cloud.r) cloud.x = -cloud.r;
      }

      ctx.fillStyle = '#7ecf72';
      ctx.fillRect(0, canvas.height * 0.72, canvas.width, canvas.height * 0.28);
      for (let i = 0; i < 18; i++) {
        const x = (i * 46) % canvas.width;
        const y = canvas.height * 0.76 + (i % 3) * 12;
        ctx.fillStyle = '#6bbf59';
        ctx.fillRect(x, y, 26, 30);
      }
    }

    function drawPlayer() {
      const x = state.player.x;
      const y = state.player.y;
      const r = state.player.radius;

      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      ctx.beginPath();
      ctx.ellipse(x, y + 26, 34, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f6cf5d';
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.9, r * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d4a126';
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 10);
      ctx.lineTo(x + 12, y - 18);
      ctx.lineTo(x + 10, y - 2);
      ctx.lineTo(x - 10, y - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x - 7, y - 4, 2.2, 0, Math.PI * 2);
      ctx.arc(x + 7, y - 4, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y + 6, 6, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }

    function drawEnemies() {
      for (const enemy of state.enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(Math.sin(enemy.phase) * 0.2);

        ctx.fillStyle = '#7b7b7b';
        ctx.beginPath();
        ctx.ellipse(0, 6, 17, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#5c5c5c';
        ctx.beginPath();
        ctx.arc(0, -10, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8d7d7';
        ctx.beginPath();
        ctx.arc(-5, -12, 4.5, 0, Math.PI * 2);
        ctx.arc(5, -12, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d84545';
        ctx.beginPath();
        ctx.arc(-5, -12, 2.2, 0, Math.PI * 2);
        ctx.arc(5, -12, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#3a3a3a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-14, 16); ctx.lineTo(-28, 27);
        ctx.moveTo(14, 16); ctx.lineTo(28, 27);
        ctx.moveTo(-8, 22); ctx.lineTo(-8, 34);
        ctx.moveTo(8, 22); ctx.lineTo(8, 34);
        ctx.stroke();

        ctx.restore();
      }
    }

    function drawBosses() {
      for (const boss of state.bosses) {
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.rotate(Math.sin(boss.phase) * 0.2);

        ctx.fillStyle = '#4c1d95';
        ctx.beginPath();
        ctx.arc(0, 0, boss.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, -8, boss.radius * 0.45, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(-10, -8, 4, 0, Math.PI * 2);
        ctx.arc(10, -8, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-10, -8, 2, 0, Math.PI * 2);
        ctx.arc(10, -8, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#fca5a5';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 12, 12, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(-boss.radius, -boss.radius - 14, boss.radius * 2, 8);
        ctx.fillStyle = '#f87171';
        ctx.fillRect(-boss.radius + 2, -boss.radius - 12, (boss.radius * 2 - 4) * (boss.hp / 3), 4);

        ctx.restore();
      }
    }

    function drawProjectiles() {
      for (const projectile of state.projectiles) {
        ctx.fillStyle = projectile.color || '#fb7185';
        ctx.beginPath();
        ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBullets() {
      for (const bullet of state.bullets) {
        bullet.trail.forEach((point, index) => {
          ctx.fillStyle = `rgba(169, 121, 42, ${index / bullet.trail.length})`;
          ctx.beginPath();
          ctx.arc(point.x, point.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#f3c76d';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 42);
        ctx.fillRect(p.x, p.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      drawParticles();
      drawBullets();
      drawProjectiles();
      drawEnemies();
      drawBosses();
      drawPlayer();
    }

    function update() {
      if (!state.started || state.gameOver) {
        draw();
        return;
      }

      updatePlayer();
      updateBullets();
      updateProjectiles();
      updateEnemies();
      updateParticles();
      draw();
    }

    function loop() {
      update();
      if (state.started && !state.gameOver) {
        requestAnimationFrame(loop);
      }
    }

    function pointerToCanvas(event) {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;
      state.player.targetX = x;
      state.player.targetY = y;
      if (state.started && !state.gameOver) {
        shootAtPointer(x, y);
      }
    }

    canvas.addEventListener('pointerdown', (event) => {
      pointerToCanvas(event);
      state.pointerActive = true;
    });

    canvas.addEventListener('pointermove', (event) => {
      if (state.pointerActive) {
        pointerToCanvas(event);
      }
    });

    canvas.addEventListener('pointerup', () => { state.pointerActive = false; });
    canvas.addEventListener('pointerleave', () => { state.pointerActive = false; });

    startButton.addEventListener('click', () => {
      resetGame();
      requestAnimationFrame(loop);
    });

    initClouds();
    draw();
  </script>
</body>
</html>
