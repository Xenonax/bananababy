<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Baby The Game</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
      background: #fffbe8;
      color: #333;
    }
    h1 {
      font-size: 2.5rem;
      color: #e8a33d;
    }
    p {
      font-size: 1.1rem;
    }
    img {
      display: block;
      max-width: 240px;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #e8a33d;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #cf8a26;
    }
  </style>
</head>
<body>
  <h1>🍌 BANANA BABY 
   The Game 🍌</h1>
  <p>CAN YOU SAVE COCOLUT ISLAND?</p>
  <p><img src="banana_baby.png" alt="Banana Baby illustration"></p>

  <div class="box">
    <p id="message">Click the button and see what happens!</p>
    <button onclick="changeMessage()">Click me</button>
  </div>

  <script>
    function changeMessage() {
      document.getElementById("message").innerText = "Howdy! 🎉";
    }
  </script>
</body>
</html>
